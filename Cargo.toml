[package]
name = "gray-kanban"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Self-contained per-project kanban board (backlog/todo/doing/review/done). Port of hermes' kanban model."

[[bin]]
name = "gray-kanban"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
